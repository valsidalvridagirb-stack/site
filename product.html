<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Товар — NEXXTLEVEL STORE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#111111;
  --paper:#ffffff;
  --smoke:#f4f4f2;
  --line:#e6e5e2;
  --mute:#767470;
  --accent:#c8362c;
  --radius:2px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color:var(--ink);background:var(--paper);
}
a{color:inherit;text-decoration:none;}

header.site{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1200px;margin:0 auto;padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:24px;
  flex-wrap:wrap;
}
.brand{font-weight:900;font-size:20px;letter-spacing:1px;text-transform:uppercase;flex-shrink:0;}
.brand span{display:block;font-size:10px;color:var(--mute);letter-spacing:3px;}
nav.menu{display:flex;gap:24px;font-size:14px;font-weight:600;flex-shrink:0;}

.site-search{
  display:flex;align-items:center;flex:1;min-width:180px;max-width:320px;
  border:1px solid var(--line);border-radius:20px;padding:6px 14px;gap:8px;
  background:var(--smoke);
}
.site-search input{border:none;background:none;outline:none;font-size:13px;width:100%;color:var(--ink);}
.site-search svg{width:15px;height:15px;stroke:var(--mute);flex-shrink:0;}

.product-page{max-width:1200px;margin:40px auto;padding:0 24px;}
.product-layout{display:grid;grid-template-columns:1fr 1fr;gap:48px;}

/* Gallery */
.gallery-container{display:flex;gap:16px;}
.thumbs-list{display:flex;flex-direction:column;gap:12px;width:80px;}
.thumb-img{
  aspect-ratio:1;object-fit:cover;border:1px solid var(--line);
  cursor:pointer;border-radius:var(--radius);
}
.thumb-img.active{border-color:var(--ink);}
.main-image-wrap{
  flex:1;aspect-ratio:1;background:var(--smoke);border-radius:var(--radius);
  overflow:hidden;position:relative;cursor:zoom-in;
}
.main-image-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.zoom-hint{
  position:absolute;bottom:12px;right:12px;
  background:rgba(17,17,17,.72);color:#fff;
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;
}
.zoom-hint svg{width:16px;height:16px;stroke:#fff;}

/* ===== Лайтбокс (повноекранний перегляд фото) ===== */
.lightbox-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(10,10,10,.94);
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;
}
.lightbox-overlay.open{display:flex;}
.lightbox-top{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:20px 24px;color:#fff;
}
.lightbox-counter{font-size:13px;font-weight:700;letter-spacing:.08em;color:#e6e5e2;}
.lightbox-close{
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;
  transition:background .2s;
}
.lightbox-close:hover{background:rgba(255,255,255,.22);}
.lightbox-close svg{width:18px;height:18px;stroke:#fff;}
.lightbox-body{
  display:flex;align-items:center;justify-content:center;gap:20px;
  width:100%;max-width:1100px;
}
.lightbox-arrow{
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.1);
  display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;
  flex-shrink:0;transition:background .2s;
}
.lightbox-arrow:hover{background:rgba(255,255,255,.22);}
.lightbox-arrow svg{width:20px;height:20px;stroke:#fff;}
.lightbox-main{flex:1;display:flex;align-items:center;justify-content:center;min-width:0;}
.lightbox-main img{max-width:100%;max-height:66vh;object-fit:contain;border-radius:var(--radius);}
.lightbox-thumbs{
  display:flex;gap:10px;margin-top:22px;max-width:90vw;overflow-x:auto;padding:4px 2px;
}
.lightbox-thumbs img{
  width:58px;height:58px;object-fit:cover;border-radius:var(--radius);cursor:pointer;
  opacity:.45;transition:opacity .2s,border-color .2s;
  border:2px solid transparent;flex-shrink:0;
}
.lightbox-thumbs img.active{opacity:1;border-color:#fff;}
@media (max-width:640px){
  .lightbox-arrow{width:36px;height:36px;}
  .lightbox-body{gap:10px;}
}

/* Details */
.product-details{display:flex;flex-direction:column;gap:24px;}
.p-brand{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);}
.p-title{font-size:32px;font-weight:900;text-transform:uppercase;line-height:1.1;}
.p-articul{font-size:12px;color:var(--mute);}
.p-price{font-size:24px;font-weight:800;color:var(--ink);}
.size-section{margin-top:16px;}
.size-title{font-size:14px;font-weight:700;margin-bottom:12px;text-transform:uppercase;}
.size-grid{display:flex;flex-wrap:wrap;gap:8px;}
.size-btn{
  padding:12px 20px;border:1px solid var(--line);background:none;
  font-weight:700;cursor:pointer;border-radius:var(--radius);transition:all .2s;
}
.size-btn:hover{border-color:var(--ink);}
.size-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}
.size-btn:disabled{opacity:.35;cursor:not-allowed;text-decoration:line-through;}

.add-btn{
  width:100%;padding:18px;background:var(--ink);color:var(--paper);
  font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:1px;
  border:none;cursor:pointer;margin-top:16px;
}
.add-btn:hover{opacity:0.9;}
</style>
</head>
<body>

<header class="site">
  <div class="header-inner">
    <a href="index.html" class="brand">NEXXTLEVEL<span>STORE</span></a>
    <nav class="menu">
      <a href="catalog.html?cat=Чоловічі%20кросівки">Чоловічі кросівки</a>
      <a href="catalog.html?cat=Жіночі%20кросівки">Жіночі кросівки</a>
    </nav>
    <form class="site-search" id="siteSearchForm">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input type="text" id="siteSearchInput" placeholder="Пошук за назвою або артикулом">
    </form>
  </div>
</header>

<main class="product-page" id="productContainer">
  <div style="text-align:center;padding:48px;">Завантаження товару...</div>
</main>

<div class="lightbox-overlay" id="lightboxOverlay">
  <div class="lightbox-top">
    <span class="lightbox-counter" id="lightboxCounter"></span>
    <div class="lightbox-close" onclick="closeLightbox()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </div>
  </div>
  <div class="lightbox-body">
    <div class="lightbox-arrow" onclick="lightboxPrev()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div class="lightbox-main">
      <img id="lightboxImg" src="" alt="">
    </div>
    <div class="lightbox-arrow" onclick="lightboxNext()">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>
  <div class="lightbox-thumbs" id="lightboxThumbs"></div>
</div>

<script>
const SUPABASE_URL = 'https://jkwppbriklmxbivndxeq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imprd3BwYnJpa2xteGJpdm5keGVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTIyMDUsImV4cCI6MjEwMTA2ODIwNX0.z1URg0dT6DsBT8nSkGvDeSrXls6bgOuU3UJBlvS-5gc';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let selectedSize = null;
let currentPrice = null;

async function fetchProduct() {
  const urlParams = new URLSearchParams(window.location.search);
  const productName = urlParams.get('name');
  const productArticul = urlParams.get('articul');
  const productId = urlParams.get('id');

  let articul = productArticul;

  // Зворотна сумісність зі старими посиланнями product.html?id=...:
  // спочатку знаходимо articul цього конкретного рядка, а далі підтягуємо ВСІ розміри цього товару.
  if (!articul && productId) {
    const { data: idRow, error: idErr } = await supabaseClient
      .from('products')
      .select('articul')
      .eq('id', productId)
      .maybeSingle();
    if (!idErr && idRow) articul = idRow.articul;
  }

  let query = supabaseClient.from('products').select('*');
  if (articul) {
    query = query.eq('articul', articul);
  } else if (productName) {
    query = query.eq('name', productName);
  } else {
    document.getElementById('productContainer').innerHTML = '<h2>Товар не знайдено</h2>';
    return;
  }

  const { data: variants, error } = await query;
  if (error || !variants || variants.length === 0) {
    document.getElementById('productContainer').innerHTML = '<h2>Товар не знайдено</h2>';
    return;
  }

  const baseProduct = variants.find(v => v.photos) || variants[0];
  const sizeMap = {};

  variants.forEach(variant => {
    const sz = variant.size !== null && variant.size !== undefined ? String(variant.size).trim() : '';
    if (sz && !(sz in sizeMap)) {
      sizeMap[sz] = {
        price: Number(variant.price),
        available: (variant.quantity === undefined || variant.quantity === null) ? true : Number(variant.quantity) > 0
      };
    }
  });

  renderProduct(baseProduct, sizeMap);
}

// Природне сортування розмірів: "36-37" -> 36, "38.5" -> 38.5
function sizeSortKey(sz) {
  const m = String(sz).match(/[\d.]+/);
  return m ? parseFloat(m[0]) : 9999;
}

function renderProduct(product, sizeMap) {
  // 1. Достаем строку с фото или из photos, или из image_url
  const rawString = product.photos || product.image_url || '';

  // 2. Разбиваем по ';' или ',', чистим ссылки от пробелов и пустых значений
  const rawPhotos = rawString
    .split(/[;,]/)
    .map(p => p.trim())
    .filter(Boolean);

  // 3. Формируем чистые, валидные URL для Weserv
  const photos = rawPhotos.map(p => {
    let clean = p;
    if (clean.startsWith('http://')) clean = clean.replace('http://', 'https://');
    else if (clean.startsWith('//')) clean = 'https:' + clean;
    
    return clean.startsWith('http') 
      ? `https://images.weserv.nl/?url=${encodeURIComponent(clean)}` 
      : clean;
  });

  const sortedSizes = Object.keys(sizeMap).sort((a, b) => sizeSortKey(a) - sizeSortKey(b));
  const initialPrice = sortedSizes.length ? sizeMap[sortedSizes[0]].price : Number(product.price);

  lightboxPhotos = photos;
  currentPhotoIndex = 0;

  const container = document.getElementById('productContainer');
  container.innerHTML = `
    <div class="product-layout">
      <div class="gallery-container">
        ${photos.length > 1 ? `
          <div class="thumbs-list">
            ${photos.map((ph, idx) => `
              <img src="${ph}" class="thumb-img ${idx === 0 ? 'active' : ''}" onclick="changePhoto('${ph}', this, ${idx})">
            `).join('')}
          </div>
        ` : ''}
        <div class="main-image-wrap" id="mainImageWrap" onclick="openLightbox(currentPhotoIndex)">
          <img id="mainPhoto" src="${photos[0] || ''}" alt="${product.name}">
          ${photos.length ? `
            <div class="zoom-hint">
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/><path d="M11 8v6M8 11h6"/></svg>
            </div>
          ` : ''}
        </div>
      </div>

      <div class="product-details">
        ${product.brand ? `<div class="p-brand">${product.brand}</div>` : ''}
        <h1 class="p-title">${product.name || product.title}</h1>
        ${product.articul ? `<div class="p-articul">Артикул: ${product.articul}</div>` : ''}
        <div class="p-price" id="productPrice">${initialPrice.toLocaleString('uk-UA')} грн</div>

        ${sortedSizes.length ? `
          <div class="size-section">
            <div class="size-title">Оберіть розмір (US)</div>
            <div class="size-grid">
              ${sortedSizes.map(size => `
                <button class="size-btn" ${sizeMap[size].available ? '' : 'disabled'}
                  onclick="selectSize('${size}', ${sizeMap[size].price}, this)">
                  ${size}
                </button>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <button class="add-btn" onclick="addToCart()">Додати в кошик</button>

        ${product.description ? `
          <div style="margin-top:24px;line-height:1.6;color:var(--mute);">
            <strong style="color:var(--ink);">ОПИС</strong><br>${product.description}
          </div>
        ` : ''}
      </div>
    </div>
  `;

  document.getElementById('lightboxThumbs').innerHTML = photos.map((ph, idx) => `
    <img src="${ph}" class="${idx === 0 ? 'active' : ''}" onclick="event.stopPropagation();lightboxIndex=${idx};updateLightboxImage();">
  `).join('');
}

function changePhoto(src, btn, idx) {
  document.getElementById('mainPhoto').src = src;
  document.querySelectorAll('.thumb-img').forEach(img => img.classList.remove('active'));
  btn.classList.add('active');
  currentPhotoIndex = idx;
}

function selectSize(size, price, btn) {
  selectedSize = size;
  currentPrice = price;
  document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('productPrice').textContent = `${price.toLocaleString('uk-UA')} грн`;
}

function addToCart() {
  if (!selectedSize) {
    alert('Будь ласка, оберіть розмір перед додаванням у кошик!');
    return;
  }
  alert(`Товар додано в кошик! Розмір: ${selectedSize}, Ціна: ${currentPrice} грн`);
}

// ===== Лайтбокс: клік по фото → повноекранний перегляд зі стрілками та мініатюрами =====
let lightboxPhotos = [];
let lightboxIndex = 0;
let currentPhotoIndex = 0;

function openLightbox(index) {
  if (!lightboxPhotos.length) return;
  lightboxIndex = index || 0;
  updateLightboxImage();
  document.getElementById('lightboxOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightboxOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function updateLightboxImage() {
  document.getElementById('lightboxImg').src = lightboxPhotos[lightboxIndex];
  document.getElementById('lightboxCounter').textContent = `${lightboxIndex + 1} / ${lightboxPhotos.length}`;
  document.querySelectorAll('.lightbox-thumbs img').forEach((img, i) => {
    img.classList.toggle('active', i === lightboxIndex);
  });
  // синхронізуємо і головне фото на сторінці
  currentPhotoIndex = lightboxIndex;
  const mainImg = document.getElementById('mainPhoto');
  if (mainImg) mainImg.src = lightboxPhotos[lightboxIndex];
  document.querySelectorAll('.thumb-img').forEach((img, i) => {
    img.classList.toggle('active', i === lightboxIndex);
  });
}

function lightboxPrev() {
  lightboxIndex = (lightboxIndex - 1 + lightboxPhotos.length) % lightboxPhotos.length;
  updateLightboxImage();
}

function lightboxNext() {
  lightboxIndex = (lightboxIndex + 1) % lightboxPhotos.length;
  updateLightboxImage();
}

document.getElementById('lightboxOverlay').addEventListener('click', e => {
  if (e.target.id === 'lightboxOverlay') closeLightbox();
});

document.addEventListener('keydown', e => {
  const overlay = document.getElementById('lightboxOverlay');
  if (!overlay.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') lightboxPrev();
  if (e.key === 'ArrowRight') lightboxNext();
});

document.getElementById('siteSearchForm').addEventListener('submit', e => {
  e.preventDefault();
  const term = document.getElementById('siteSearchInput').value.trim();
  const url = term ? `catalog.html?search=${encodeURIComponent(term)}` : 'catalog.html';
  window.location.href = url;
});

fetchProduct();
</script>
</body>
</html>
