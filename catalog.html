<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог — NEXXTLEVEL STORE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --smoke:#f8f8f6;
    --line:#e6e5e2;
    --mute:#767470;
    --accent:#c8362c;
    --radius:4px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

  /* Header */
  header.site{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .header-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;max-width:1240px;margin:0 auto;
  }
  .logo{display:flex;flex-direction:column;line-height:1;}
  .logo b{font-size:21px;letter-spacing:.02em;font-weight:800;}
  .logo span{font-size:9px;letter-spacing:.32em;color:var(--mute);margin-top:4px;font-weight:600;}
  nav.main-nav{display:flex;gap:36px;}
  nav.main-nav a{font-size:14px;font-weight:500;padding:4px 0;transition:opacity .2s;}
  nav.main-nav a:hover{opacity:.55;}
  .header-icons{display:flex;align-items:center;gap:22px;}
  .icon-btn{position:relative;display:flex;}
  .icon-btn svg{width:19px;height:19px;stroke:var(--ink);}
  .badge-count{
    position:absolute;top:-7px;right:-8px;background:var(--ink);color:#fff;
    font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }

  /* Main Section */
  .catalog-container {
    max-width: 1240px;
    margin: 40px auto;
    padding: 0 32px;
  }

  .catalog-title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 24px;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 12px;
  }

  /* Product Grid */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 22px;
    min-height: 400px;
  }

  .product-card {
    display: flex;
    flex-direction: column;
    color: inherit;
    text-decoration: none;
    background: #ffffff;
    border: 1px solid transparent;
    padding: 10px;
    border-radius: 4px;
    transition: all 0.25s ease;
  }

  .product-card:hover {
    border-color: var(--line);
    box-shadow: 0 8px 20px rgba(0,0,0,0.05);
  }

  .product-media {
    position: relative;
    background: var(--smoke);
    aspect-ratio: 1/1;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 12px;
    border-radius: 2px;
    overflow: hidden;
  }

  .product-media img, .product-media svg {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .35s ease;
  }

  .product-card:hover .product-media img {
    transform: scale(1.05);
  }

  .wish-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(2px);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    z-index: 3;
    transition: transform 0.15s;
  }

  .wish-btn svg {
    width: 15px;
    height: 15px;
    stroke: var(--ink);
    fill: none;
  }

  .wish-btn.active svg {
    fill: var(--accent);
    stroke: var(--accent);
  }

  .product-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    line-height: 1.35;
    height: 36px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .product-price {
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 10px;
    color: var(--ink);
  }

  .size-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }

  .size-row span {
    font-size: 10px;
    color: var(--mute);
    border: 1px solid var(--line);
    padding: 3px 6px;
    border-radius: 2px;
    font-weight: 600;
    background: #fafafa;
  }

  /* Pagination UI */
  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 48px;
  }

  .page-btn {
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-size: 13px;
    font-weight: 600;
    background: #ffffff;
    color: var(--ink);
    transition: all 0.2s;
  }

  .page-btn:hover:not(:disabled) {
    border-color: var(--ink);
    background: var(--ink);
    color: #ffffff;
  }

  .page-btn.active {
    background: var(--ink);
    color: #ffffff;
    border-color: var(--ink);
  }

  .page-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  footer {
    background: var(--ink);
    color: #fff;
    padding: 40px 0 28px;
    margin-top: 60px;
  }

  .foot-bottom {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 32px;
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: #84837f;
  }

  @media (max-width: 980px) {
    .product-grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (max-width: 560px) {
    .product-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<header class="site">
  <div class="header-row">
    <a href="index.html" class="logo">
      <b>NEXXTLEVEL</b>
      <span>S T O R E</span>
    </a>
    <nav class="main-nav">
      <a href="catalog.html?cat=Чоловічі кросівки">Чоловіче</a>
      <a href="catalog.html?cat=Жіночі кросівки">Жіноче</a>
      <a href="catalog.html">Всі товари</a>
    </nav>
    <div class="header-icons">
      <button class="icon-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 21s-7.5-4.9-10-9.3C0.3 8.1 2 4.5 5.7 4c2-.3 3.7.7 6.3 3 2.6-2.3 4.3-3.3 6.3-3 3.7.5 5.4 4.1 3.7 7.7C19.5 16.1 12 21 12 21z"/></svg>
        <span class="badge-count" id="wishCount">0</span>
      </button>
    </div>
  </div>
</header>

<main class="catalog-container">
  <h1 class="catalog-title" id="pageTitle">Каталог Товарів</h1>
  <div class="product-grid" id="productGrid"></div>
  <div class="pagination" id="pagination"></div>
</main>

<footer>
  <div class="foot-bottom">
    <span>© 2026 NexxtLevelStore. Всі права захищені.</span>
  </div>
</footer>

<script>
const SUPABASE_URL = 'https://jkwppbriklmxbivndxeq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imprd3BwYnJpa2xteGJpdm5keGVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTIyMDUsImV4cCI6MjEwMTA2ODIwNX0.z1URg0dT6DsBT8nSkGvDeSrXls6bgOuU3UJBlvS-5gc';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const ITEMS_PER_PAGE = 20; // Завантажуємо по 20 шт
let currentPage = 1;
let wishlist = new Set(JSON.parse(localStorage.getItem('wishlist') || '[]'));

// Параметри з URL (категорія або пошуковий запит)
const urlParams = new URLSearchParams(window.location.search);
const categoryParam = urlParams.get('cat');
const searchParam = urlParams.get('search');

if (categoryParam) {
  document.getElementById('pageTitle').textContent = categoryParam;
} else if (searchParam) {
  document.getElementById('pageTitle').textContent = `Пошук: "${searchParam}"`;
}

function updateWishBadge(){
  document.getElementById('wishCount').textContent = wishlist.size;
}

function placeholderSVG(){
  return `<svg viewBox="0 0 260 170" fill="none">
    <path d="M15 140c0-18 14-30 36-35l64-16c11-3 17-11 20-22l5-16c2-6 8-10 15-9l22 6c8 2 11 9 9 17l-6 26c-3 14-1 25 6 34 6 8 8 17 3 25-6 11-20 15-36 15H45c-18 0-30-11-30-25z" fill="#e6e5e2" stroke="#767470" stroke-width="2"/>
  </svg>`;
}

async function loadProducts(page = 1){
  currentPage = page;
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '<p style="grid-column:1/-1;color:var(--mute);font-size:14px;padding:40px 0;text-align:center;">Завантаження товарів...</p>';

  // Розрахунок діапазону для Supabase
  const from = (page - 1) * ITEMS_PER_PAGE;
  const to = from + ITEMS_PER_PAGE - 1;

  let query = supabaseClient
    .from('product_summary')
    .select('*', { count: 'exact' });

  // Фільтрація за категорією або пошуком
  if (categoryParam) {
    query = query.ilike('category', `%${categoryParam}%`);
  }
  if (searchParam) {
    query = query.or(`name.ilike.%${searchParam}%,articul.ilike.%${searchParam}%`);
  }

  const { data, count, error } = await query
    .order('id', { ascending: false })
    .range(from, to);

  if (error || !data || data.length === 0) {
    grid.innerHTML = '<p style="grid-column:1/-1;color:var(--mute);font-size:14px;padding:40px 0;text-align:center;">Товарів не знайдено.</p>';
    document.getElementById('pagination').innerHTML = '';
    return;
  }

  grid.innerHTML = '';
  data.forEach(p => {
    let rawPhoto = p.photos ? p.photos.split(',')[0].trim() : null;
    if (!rawPhoto && p.photos) rawPhoto = p.photos.split(';')[0].trim();
    
    let photo = null;
    if (rawPhoto) {
      if (rawPhoto.startsWith('http://')) rawPhoto = rawPhoto.replace('http://', 'https://');
      else if (rawPhoto.startsWith('//')) rawPhoto = 'https:' + rawPhoto;
      photo = rawPhoto.startsWith('http') ? `https://images.weserv.nl/?url=${encodeURIComponent(rawPhoto)}` : rawPhoto;
    }
    const sizes = Array.isArray(p.sizes) ? p.sizes : [];
    const isWished = wishlist.has(p.id);

    const card = document.createElement('a');
    card.href = `product.html?articul=${encodeURIComponent(p.articul || '')}`;
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-media">
        <button class="wish-btn ${isWished ? 'active' : ''}" data-id="${p.id}" aria-label="До обраного">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.3C0.3 8.1 2 4.5 5.7 4c2-.3 3.7.7 6.3 3 2.6-2.3 4.3-3.3 6.3-3 3.7.5 5.4 4.1 3.7 7.7C19.5 16.1 12 21 12 21z"/></svg>
        </button>
        ${photo ? `<img src="${photo}" alt="${p.name}" loading="lazy">` : placeholderSVG()}
      </div>
      <div class="product-name" title="${p.name}">${p.name}</div>
      <div class="product-price">${Number(p.price).toLocaleString('uk-UA')} грн</div>
      <div class="size-row">${sizes.slice(0, 4).map(s=>`<span>${s}</span>`).join('')}</div>
    `;
    grid.appendChild(card);
  });

  renderPagination(count, page);
}

// Генерація блоку пагінації
function renderPagination(totalItems, page) {
  const paginationEl = document.getElementById('pagination');
  const totalPages = Math.ceil(totalItems / ITEMS_PER_PAGE);

  if (totalPages <= 1) {
    paginationEl.innerHTML = '';
    return;
  }

  let html = `<button class="page-btn" ${page === 1 ? 'disabled' : ''} onclick="changePage(${page - 1})">← Назад</button>`;

  for (let i = 1; i <= totalPages; i++) {
    // Відображаємо лише першу, останню та найближчі сторінки
    if (i === 1 || i === totalPages || (i >= page - 1 && i <= page + 1)) {
      html += `<button class="page-btn ${i === page ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
    } else if (i === page - 2 || i === page + 2) {
      html += `<span style="color:var(--mute)">...</span>`;
    }
  }

  html += `<button class="page-btn" ${page === totalPages ? 'disabled' : ''} onclick="changePage(${page + 1})">Вперед →</button>`;

  paginationEl.innerHTML = html;
}

function changePage(newPage) {
  loadProducts(newPage);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('productGrid').addEventListener('click', e => {
  const btn = e.target.closest('.wish-btn');
  if (!btn) return;
  
  e.preventDefault();
  const id = btn.dataset.id;
  
  if (wishlist.has(id)) {
    wishlist.delete(id);
    btn.classList.remove('active');
  } else {
    wishlist.add(id);
    btn.classList.add('active');
  }
  
  localStorage.setItem('wishlist', JSON.stringify(Array.from(wishlist)));
  updateWishBadge();
});

updateWishBadge();
loadProducts(1);
</script>
</body>
</html>
