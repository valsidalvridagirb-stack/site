<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Каталог — NEXXTLEVEL STORE</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#111111;
  --paper:#ffffff;
  --smoke:#f4f4f2;
  --line:#e6e5e2;
  --mute:#767470;
  --accent:#c8362c;
  --radius:2px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  color:var(--ink);
  background:var(--paper);
  -webkit-font-smoothing:antialiased;
}
img,svg{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}

/* ===== Header ===== */
header.site{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
}
.header-inner{
  max-width:1200px;margin:0 auto;padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;
}
.brand{font-weight:900;font-size:20px;letter-spacing:1px;text-transform:uppercase;}
.brand span{display:block;font-size:10px;color:var(--mute);letter-spacing:3px;}
nav.menu{display:flex;gap:24px;font-size:14px;font-weight:600;}
nav.menu a:hover{color:var(--accent);}

/* ===== Catalog Grid ===== */
.catalog-container{max-width:1200px;margin:40px auto;padding:0 24px;}
.catalog-header{margin-bottom:24px;}
.catalog-title{font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:0.5px;}
.catalog-count{color:var(--mute);font-size:14px;margin-top:4px;}

.product-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(240px, 1fr));
  gap:32px 24px;
}
.product-card{display:flex;flex-direction:column;gap:8px;}
.product-card:hover .product-media img{transform:scale(1.04);}
.product-media{
  aspect-ratio:1;background:var(--smoke);
  border-radius:var(--radius);overflow:hidden;
  position:relative;display:flex;align-items:center;justify-content:center;
}
.product-media img{width:100%;height:100%;object-fit:cover;transition:transform .3s ease;}
.product-name{font-weight:700;font-size:15px;line-height:1.3;margin-top:4px;}
.product-price{font-weight:800;font-size:16px;color:var(--ink);}
.empty-state{grid-column:1/-1;text-align:center;padding:48px 0;color:var(--mute);}
</style>
</head>
<body>

<header class="site">
  <div class="header-inner">
    <a href="index.html" class="brand">NEXXTLEVEL<span>STORE</span></a>
    <nav class="menu">
      <a href="catalog.html?cat=Чоловічі кросівки">Чоловічі кросівки</a>
      <a href="catalog.html?cat=Жіночі кросівки">Жіночі кросівки</a>
      <a href="catalog.html">Усі товари</a>
    </nav>
  </div>
</header>

<main class="catalog-container">
  <div class="catalog-header">
    <h1 class="catalog-title" id="pageTitle">Каталог</h1>
    <div class="catalog-count" id="resultsCount">Завантаження товарів...</div>
  </div>
  <div class="product-grid" id="productGrid"></div>
  <div style="text-align:center;margin-top:32px;">
    <button id="loadMoreBtn" style="display:none;padding:14px 32px;border:1px solid var(--line);background:none;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.05em;cursor:pointer;border-radius:var(--radius);">Показати ще</button>
  </div>
</main>

<script>
const SUPABASE_URL = 'https://jkwppbriklmxbivndxeq.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imprd3BwYnJpa2xteGJpdm5keGVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTIyMDUsImV4cCI6MjEwMTA2ODIwNX0.z1URg0dT6DsBT8nSkGvDeSrXls6bgOuU3UJBlvS-5gc';

var supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PAGE_SIZE = 40;
let currentOffset = 0;
let currentCat = null;
let totalLoaded = 0;

const fallbackPhoto = "data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='300' viewBox='0 0 300 300'%3E%3Crect width='100%25' height='100%25' fill='%2523f4f4f2'/%3E%3Ctext x='50%25' y='50%25' dominant-baseline='middle' text-anchor='middle' font-family='sans-serif' font-size='14' fill='%2523767470'%3ENo Photo%3C/text%3E%3C/svg%3E";

function cardHTML(p) {
  let rawPhoto = p.photos ? p.photos.split(';')[0].trim() : null;
  let photo = fallbackPhoto;

  if (rawPhoto) {
    if (rawPhoto.startsWith('http://')) rawPhoto = rawPhoto.replace('http://', 'https://');
    else if (rawPhoto.startsWith('//')) rawPhoto = 'https:' + rawPhoto;
    photo = `https://images.weserv.nl/?url=${encodeURIComponent(rawPhoto)}`;
  }

  const title = p.name || 'Без назви';

  return `
    <div class="product-card">
      <a href="product.html?articul=${encodeURIComponent(p.articul || '')}" class="product-link">
        <div class="product-media">
          <img src="${photo}" alt="${title}" loading="lazy" onerror="this.onerror=null;this.src='${fallbackPhoto}';">
        </div>
        <div class="product-info">
          <h3 class="product-name">${title}</h3>
          <div class="product-price">${Number(p.price || 0)} грн</div>
        </div>
      </a>
    </div>
  `;
}

async function loadPage() {
  const grid = document.getElementById('productGrid');
  const countEl = document.getElementById('resultsCount');
  const loadMoreBtn = document.getElementById('loadMoreBtn');

  loadMoreBtn.disabled = true;
  loadMoreBtn.textContent = 'Завантаження...';

  let query = supabaseClient
    .from('product_summary')
    .select('id, articul, name, price, photos', { count: 'exact' })
    .order('id', { ascending: false })
    .range(currentOffset, currentOffset + PAGE_SIZE - 1);

  if (currentCat) {
    query = query.contains('site_categories', [currentCat]);
  }

  const { data, error, count } = await query;

  if (error) {
    console.error('Помилка Supabase:', error);
    grid.innerHTML = `<p class="empty-state">Помилка завантаження: ${error.message}</p>`;
    countEl.textContent = 'Помилка';
    loadMoreBtn.style.display = 'none';
    return;
  }

  if (currentOffset === 0 && (!data || data.length === 0)) {
    grid.innerHTML = '<p class="empty-state">Товарів у цій категорії не знайдено.</p>';
    countEl.textContent = 'Знайдено: 0 товарів';
    loadMoreBtn.style.display = 'none';
    return;
  }

  const html = data.map(cardHTML).join('');
  grid.insertAdjacentHTML('beforeend', html);

  totalLoaded += data.length;
  currentOffset += PAGE_SIZE;
  countEl.textContent = `Знайдено: ${count ?? totalLoaded} товарів (показано ${totalLoaded})`;

  loadMoreBtn.disabled = false;
  loadMoreBtn.textContent = 'Показати ще';
  loadMoreBtn.style.display = (count && totalLoaded < count) ? 'inline-block' : 'none';
}

function loadCatalog() {
  const urlParams = new URLSearchParams(window.location.search);
  currentCat = urlParams.get('cat');
  currentOffset = 0;
  totalLoaded = 0;

  if (currentCat) {
    document.getElementById('pageTitle').textContent = currentCat;
  }

  document.getElementById('productGrid').innerHTML = '';
  document.getElementById('resultsCount').textContent = 'Завантаження товарів...';

  loadPage();
}

document.getElementById('loadMoreBtn').addEventListener('click', loadPage);

loadCatalog();
</script>
</body>
</html>
