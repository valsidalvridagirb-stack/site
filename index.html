<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXXTLEVEL STORE — Оригінальний одяг, взуття та аксесуари із США</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#111111;
    --paper:#ffffff;
    --smoke:#f4f4f2;
    --line:#e6e5e2;
    --mute:#767470;
    --accent:#c8362c;
    --radius:2px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--paper);
    -webkit-font-smoothing:antialiased;
  }
  img,svg{display:block;max-width:100%;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  ul{list-style:none;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px;}

  /* ===== Header ===== */
  header.site{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .header-row{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 32px;max-width:1240px;margin:0 auto;
  }
  .logo{display:flex;flex-direction:column;line-height:1;}
  .logo b{font-size:21px;letter-spacing:.02em;font-weight:800;}
  .logo span{font-size:9px;letter-spacing:.32em;color:var(--mute);margin-top:4px;font-weight:600;}
  nav.main-nav{display:flex;gap:36px;}
  nav.main-nav a{
    font-size:14px;font-weight:500;letter-spacing:.01em;position:relative;padding:4px 0;
    transition:opacity .2s;
  }
  nav.main-nav a:hover{opacity:.55;}
  nav.main-nav a.sale{color:var(--accent);font-weight:700;}
  .header-icons{display:flex;align-items:center;gap:22px;}
  .icon-btn{position:relative;display:flex;}
  .icon-btn svg{width:19px;height:19px;stroke:var(--ink);}
  .badge-count{
    position:absolute;top:-7px;right:-8px;background:var(--ink);color:#fff;
    font-size:10px;font-weight:700;width:16px;height:16px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }

  /* ===== Hero Banner у Чорно-Білому Стилі ===== */
  .hero-banner {
    position: relative;
    min-height: 540px;
    display: flex;
    align-items: center;
    justify-content: center;
    /* Чорно-біле якісне фото з затемненням для контрасту */
    background-image: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), url('https://images.unsplash.com/photo-1552346154-21d32810aba3?q=80&w=1600&auto=format&fit=crop');
    background-size: cover;
    background-position: center;
    filter: grayscale(100%); /* Повний чорно-білий ефект */
    color: #ffffff;
    padding: 60px 20px;
    text-align: center;
  }

  .hero-banner-content {
    max-width: 750px;
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 22px;
  }

  /* Логотип бренду на баннері */
  .hero-brand-logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    border: 3px solid #ffffff;
    padding: 18px 36px;
    background: rgba(0, 0, 0, 0.4);
    backdrop-filter: blur(4px);
    margin-bottom: 10px;
  }

  .hero-brand-logo b {
    font-size: 42px;
    font-weight: 900;
    letter-spacing: 4px;
    line-height: 1;
    text-transform: uppercase;
  }

  .hero-brand-logo span {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 12px;
    margin-top: 6px;
    text-transform: uppercase;
    color: #d1d1d1;
  }

  .hero-banner-subtitle {
    font-size: 17px;
    color: #e0e0e0;
    max-width: 550px;
    line-height: 1.5;
    letter-spacing: 0.5px;
    font-weight: 300;
  }

  /* Форма пошуку */
  .hero-search-form {
    display: flex;
    width: 100%;
    max-width: 580px;
    background: #ffffff;
    border-radius: 2px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    margin-top: 10px;
  }

  .hero-search-input {
    flex: 1;
    border: none;
    padding: 16px 20px;
    font-size: 14px;
    color: #111;
    outline: none;
  }

  .hero-search-btn {
    background: #000000;
    color: #ffffff;
    padding: 16px 28px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    transition: background 0.2s, color 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .hero-search-btn:hover {
    background: #ffffff;
    color: #000000;
  }

  /* ===== Category strip ===== */
  .cats{max-width:1240px;margin:40px auto 0;padding:0 32px 64px;display:grid;grid-template-columns:repeat(2,1fr);gap:24px;}
  .cat-card{background:var(--smoke);padding:28px 26px;display:flex;flex-direction:column;min-height:160px;justify-content:center;}
  .cat-card .cat-head h3{font-size:18px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin-bottom:8px;}
  .cat-card .cat-head a{font-size:13px;color:var(--mute);display:inline-flex;align-items:center;gap:6px;font-weight:600;}
  .cat-card .cat-head a svg{width:12px;height:12px;transition:transform .2s;}
  .cat-card:hover .cat-head a svg{transform:translateX(3px);}

  /* ===== New arrivals ===== */
  .arrivals{max-width:1240px;margin:0 auto;padding:32px 32px 72px;}
  .arrivals-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:32px;}
  .arrivals-head h2{font-size:16px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;}
  .arrivals-head a{font-size:13px;color:var(--mute);font-weight:600;display:flex;align-items:center;gap:6px;}
  .product-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;}
  .product-card{display:flex;flex-direction:column;color:inherit;text-decoration:none;}
  .product-media{
    position:relative;background:var(--smoke);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
    margin-bottom:14px;overflow:hidden;
  }
  .product-media img,.product-media svg{width:100%;height:100%;object-fit:cover;transition:transform .35s;}
  .product-card:hover .product-media img{transform:scale(1.04);}
  .wish-btn{
    position:absolute;top:12px;right:12px;width:30px;height:30px;background:#fff;border-radius:50%;
    display:flex;align-items:center;justify-content:center;box-shadow:0 1px 3px rgba(0,0,0,.08);
    z-index:3;
  }
  .wish-btn svg{width:15px;height:15px;stroke:var(--ink);fill:none;transition:.15s;}
  .wish-btn.active svg{fill:var(--accent);stroke:var(--accent);}
  .product-name{font-size:13.5px;font-weight:600;margin-bottom:4px;}
  .product-price{font-size:13.5px;font-weight:700;margin-bottom:12px;}
  .size-row{display:flex;gap:6px;flex-wrap:wrap;}
  .size-row span{
    font-size:11px;color:var(--mute);border:1px solid var(--line);padding:4px 7px;
    display:flex;align-items:center;justify-content:center;font-weight:600;
  }

  /* ===== Footer ===== */
  footer{background:var(--ink);color:#fff;padding:40px 0 28px;}
  .foot-bottom{
    max-width:1240px;margin:0 auto;padding:0 32px;
    display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#84837f;
  }

  @media (max-width:980px){
    nav.main-nav{display:none;}
    .hero-brand-logo b{font-size:32px;}
    .hero-brand-logo span{font-size:10px;letter-spacing:8px;}
    .cats{grid-template-columns:1fr;}
    .product-grid{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:560px){
    .header-row{padding:16px 20px;}
    .wrap,.cats,.arrivals,.foot-bottom{padding-left:20px;padding-right:20px;}
    .hero-banner{min-height:460px;padding:40px 16px;}
    .hero-brand-logo{padding:12px 20px;}
    .hero-brand-logo b{font-size:24px;}
    .hero-brand-logo span{font-size:9px;letter-spacing:6px;}
    .hero-search-form{flex-direction:column;background:transparent;box-shadow:none;}
    .hero-search-input{border-radius:2px;margin-bottom:8px;}
    .hero-search-btn{border-radius:2px;justify-content:center;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="header-row">
    <a href="index.html" class="logo">
      <b>NEXXTLEVEL</b>
      <span>S T O R E</span>
    </a>
    <nav class="main-nav">
      <a href="catalog.html?cat=Чоловічі кросівки">Чоловіче</a>
      <a href="catalog.html?cat=Жіночі кросівки">Жіноче</a>
      <a href="#arrivals">Новинки</a>
      <a href="catalog.html" class="sale">SALE</a>
    </nav>
    <div class="header-icons">
      <button class="icon-btn" aria-label="Обране">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 21s-7.5-4.9-10-9.3C0.3 8.1 2 4.5 5.7 4c2-.3 3.7.7 6.3 3 2.6-2.3 4.3-3.3 6.3-3 3.7.5 5.4 4.1 3.7 7.7C19.5 16.1 12 21 12 21z"/></svg>
        <span class="badge-count" id="wishCount">0</span>
      </button>
      <button class="icon-btn" aria-label="Кошик">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M6 7h12l-1 12H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>
        <span class="badge-count" id="cartCount">0</span>
      </button>
    </div>
  </div>
</header>

<!-- Чорно-білий баннер з логотипом бренду -->
<section class="hero-banner">
  <div class="hero-banner-content">
    
    <!-- Логотип NEXXTLEVEL STORE на баннері -->
    <div class="hero-brand-logo">
      <b>NEXXTLEVEL</b>
      <span>S T O R E</span>
    </div>

    <!-- Новий текст -->
    <p class="hero-banner-subtitle">Оригінальний одяг, взуття та аксесуари із США</p>
    
    <!-- Форма пошуку -->
    <form class="hero-search-form" id="heroSearchForm">
      <input 
        type="text" 
        class="hero-search-input" 
        id="heroSearchInput" 
        placeholder="Введіть артикул або назву товару (наприклад, GZ3625)..." 
        required
      >
      <button type="submit" class="hero-search-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        Пошук
      </button>
    </form>
  </div>
</section>

<section class="cats" id="categories">
  <div class="cat-card">
    <div class="cat-head">
      <h3>Чоловіче взуття</h3>
      <a href="catalog.html?cat=Чоловічі кросівки">Дивитись все <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </div>
  <div class="cat-card">
    <div class="cat-head">
      <h3>Жіноче взуття</h3>
      <a href="catalog.html?cat=Жіночі кросівки">Дивитись все <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
    </div>
  </div>
</section>

<section class="arrivals" id="arrivals">
  <div class="arrivals-head">
    <h2>Новинки</h2>
    <a href="catalog.html">Дивитись все <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
  </div>
  <div class="product-grid" id="productGrid"></div>
</section>

<footer>
  <div class="foot-bottom">
    <span>© 2026 NexxtLevelStore. Всі права захищені.</span>
  </div>
</footer>

<script>
const SUPABASE_URL = 'https://jkwppbriklmxbivndxeq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imprd3BwYnJpa2xteGJpdm5keGVxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU0OTIyMDUsImV4cCI6MjEwMTA2ODIwNX0.z1URg0dT6DsBT8nSkGvDeSrXls6bgOuU3UJBlvS-5gc';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let wishlist = new Set(JSON.parse(localStorage.getItem('wishlist') || '[]'));

function updateWishBadge(){
  document.getElementById('wishCount').textContent = wishlist.size;
}

document.getElementById('heroSearchForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const query = document.getElementById('heroSearchInput').value.trim();
  if (query) {
    window.location.href = `catalog.html?search=${encodeURIComponent(query)}`;
  }
});

function placeholderSVG(){
  return `<svg viewBox="0 0 260 170" fill="none">
    <path d="M15 140c0-18 14-30 36-35l64-16c11-3 17-11 20-22l5-16c2-6 8-10 15-9l22 6c8 2 11 9 9 17l-6 26c-3 14-1 25 6 34 6 8 8 17 3 25-6 11-20 15-36 15H45c-18 0-30-11-30-25z" fill="#e6e5e2" stroke="#767470" stroke-width="2"/>
  </svg>`;
}

async function loadProducts(){
  const grid = document.getElementById('productGrid');
  grid.innerHTML = '<p style="grid-column:1/-1;color:var(--mute);font-size:13px;">Завантаження товарів...</p>';

  const { data, error } = await supabaseClient
    .from('product_summary')
    .select('*')
    .order('id', { ascending: false })
    .limit(10);

  if (error || !data) {
    grid.innerHTML = '<p style="grid-column:1/-1;color:var(--mute);font-size:13px;">Не вдалося завантажити товари.</p>';
    return;
  }

  grid.innerHTML = '';
  data.forEach(p => {
    let rawPhoto = p.photos ? p.photos.split(',')[0].trim() : null;
    if (!rawPhoto && p.photos) rawPhoto = p.photos.split(';')[0].trim();
    
    let photo = null;
    if (rawPhoto) {
      if (rawPhoto.startsWith('http://')) rawPhoto = rawPhoto.replace('http://', 'https://');
      else if (rawPhoto.startsWith('//')) rawPhoto = 'https:' + rawPhoto;
      photo = rawPhoto.startsWith('http') ? `https://images.weserv.nl/?url=${encodeURIComponent(rawPhoto)}` : rawPhoto;
    }
    const sizes = Array.isArray(p.sizes) ? p.sizes : [];
    const isWished = wishlist.has(p.id);

    const card = document.createElement('a');
    card.href = `product.html?articul=${encodeURIComponent(p.articul || '')}`;
    card.className = 'product-card';
    card.innerHTML = `
      <div class="product-media">
        <button class="wish-btn ${isWished ? 'active' : ''}" data-id="${p.id}" aria-label="До обраного">
          <svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.9-10-9.3C0.3 8.1 2 4.5 5.7 4c2-.3 3.7.7 6.3 3 2.6-2.3 4.3-3.3 6.3-3 3.7.5 5.4 4.1 3.7 7.7C19.5 16.1 12 21 12 21z"/></svg>
        </button>
        ${photo ? `<img src="${photo}" alt="${p.name}" loading="lazy">` : placeholderSVG()}
      </div>
      <div class="product-name">${p.name}</div>
      <div class="product-price">${Number(p.price).toLocaleString('uk-UA')} грн</div>
      <div class="size-row">${sizes.slice(0, 5).map(s=>`<span>${s}</span>`).join('')}</div>
    `;
    grid.appendChild(card);
  });

  grid.addEventListener('click', e => {
    const btn = e.target.closest('.wish-btn');
    if (!btn) return;
    
    e.preventDefault();
    const id = btn.dataset.id;
    
    if (wishlist.has(id)) {
      wishlist.delete(id);
      btn.classList.remove('active');
    } else {
      wishlist.add(id);
      btn.classList.add('active');
    }
    
    localStorage.setItem('wishlist', JSON.stringify(Array.from(wishlist)));
    updateWishBadge();
  });
}

updateWishBadge();
loadProducts();
</script>
</body>
</html>
